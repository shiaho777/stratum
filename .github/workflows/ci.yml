name: CI

# CI is the merge gate for PRs into main: required check must be green
# before merge. It builds the engine and runs the model-free correctness
# tests (quant kernel cross-validation, Leviathan-Chen sampler exactness).
# Full-model greedy gates (v199-v217) need a local GGUF and remain a
# maintainer step — see docs/VALIDATION.md for what automated validation
# covers and what it does not. This workflow never closes Issues; Issues
# close via "Fixes #N" when the PR merges.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-tests:
    name: build + kernel tests (macos-14 arm64)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Default dev path: Metal shaders compiled, MemX off so CI never
      # fetches an external dependency from the network.
      - name: Build engine (Metal, MemX off)
        working-directory: stratum/native
        run: make USE_MEMX=0 -j3

      - name: Quant kernel cross-validation + sampler exactness
        working-directory: stratum/native
        run: make USE_MEMX=0 tests

      - name: Build logit_compare (offline backend comparison tool)
        working-directory: stratum/native
        run: make USE_MEMX=0 logit_compare

      # The CPU-only configuration has no other automated coverage;
      # at least keep it compiling.
      - name: Build CPU-only variant (no Metal)
        working-directory: stratum/native
        run: make clean && make USE_MEMX=0 USE_METAL=0 -j3

  # The engine parses untrusted GGUF files and does pointer arithmetic over
  # mmaps; these model-free tests are the highest-value sanitizer coverage
  # available without a local model. Any ASan/UBSan report fails the gate.
  sanitizers:
    name: kernel tests under ASan + UBSan (macos-14 arm64)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build quant_test + spec_sample_test with sanitizers
        working-directory: stratum/native
        run: |
          clang -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
                -fblocks -mcpu=apple-m1 -o /tmp/quant_test_asan quant_test.c
          clang -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
                -o /tmp/spec_sample_test_asan spec_sample_test.c

      - name: Quant kernel cross-validation under sanitizers
        working-directory: stratum/native
        run: /tmp/quant_test_asan

      - name: Sampler exactness under sanitizers
        working-directory: stratum/native
        run: /tmp/spec_sample_test_asan

  # Real inference smoke: a deterministic tiny model is GENERATED at test time
  # (the repo never ships weights) and run end-to-end through the engine —
  # GGUF parse, config, discovery, prefill, decode loop, KV advance, sampler.
  # The CI build is CPU-only and MemX-free, which is byte-deterministic, so
  # the pinned greedy sequence is a true regression assertion. This is also
  # the only automated coverage for the llama architecture.
  smoke-tiny-model:
    name: tiny-model inference smoke (macos-14 arm64)
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build engine (CPU-only, MemX off)
        working-directory: stratum/native
        run: make USE_MEMX=0 USE_METAL=0 -j3

      - name: Generate deterministic tiny model
        run: python3 stratum/tools/make_tiny_model.py --out /tmp/tiny.gguf

      - name: Greedy decode and pin the argmax sequence
        working-directory: stratum/native
        run: |
          OUT=$(STRATUM_NO_GPU=1 ./stratum /tmp/tiny.gguf 4 1 2 3 4 5 6 7 8 2>&1)
          echo "$OUT"
          SEQ=$(echo "$OUT" | grep -oE 'stratum_argmax ?=? ?[0-9]+' | grep -oE '[0-9]+$' | tr '\n' ' ' | xargs)
          echo "pinned sequence: $SEQ"
          [ "$SEQ" = "70 118 22 60 60" ]
