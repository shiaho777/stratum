<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="880" height="420" fill="#FFFFFF"/>
  <!-- panels -->
  <rect x="16" y="24" width="200" height="150" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <rect x="300" y="24" width="220" height="150" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <rect x="604" y="24" width="260" height="150" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
  <!-- disk -->
  <text x="116" y="50" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">Model file (disk)</text>
  <g transform="translate(116,105)">
    <rect x="-52" y="-30" width="104" height="60" rx="6" fill="#DBEAFE" stroke="#2563EB"/>
    <circle cx="0" cy="0" r="20" fill="#FFFFFF" stroke="#2563EB"/>
    <circle cx="0" cy="0" r="6" fill="#2563EB"/>
  </g>
  <text x="116" y="158" text-anchor="middle" font-size="12" fill="#475569">27B = 11.98 GB · never loaded whole</text>
  <!-- page cache -->
  <text x="410" y="50" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">OS page cache</text>
  <g transform="translate(410,105)">
    <rect x="-80" y="-30" width="160" height="60" rx="6" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="0" y="-6" text-anchor="middle" font-size="11" fill="#4C1D95">mmap · read-only</text>
    <text x="0" y="10" text-anchor="middle" font-size="11" fill="#4C1D95">reclaimable · no mlock</text>
    <text x="0" y="24" text-anchor="middle" font-size="10" fill="#7C3AED">madvise hints only</text>
  </g>
  <text x="410" y="158" text-anchor="middle" font-size="12" fill="#475569">weights stream through, once per token</text>
  <!-- engine -->
  <text x="734" y="50" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">Engine (CPU NEON / Metal)</text>
  <g transform="translate(734,105)">
    <rect x="-100" y="-30" width="200" height="60" rx="6" fill="#D1FAE5" stroke="#059669"/>
    <text x="0" y="-8" text-anchor="middle" font-size="11" fill="#065F46">Q2_K…Q6_K · F16/F32 kernels</text>
    <text x="0" y="10" text-anchor="middle" font-size="11" fill="#065F46">spec decode · MULTISEQ</text>
    <text x="0" y="24" text-anchor="middle" font-size="10" fill="#047857">greedy bit-exact</text>
  </g>
  <text x="734" y="158" text-anchor="middle" font-size="12" fill="#475569">one token = one full weight sweep</text>
  <!-- arrows -->
  <g stroke="#475569" stroke-width="2" fill="none">
    <path d="M 220 99 H 292"/>
    <path d="M 524 99 H 596"/>
  </g>
  <polygon points="296,99 286,94 286,104" fill="#475569"/>
  <polygon points="600,99 590,94 590,104" fill="#475569"/>
  <!-- anon memory floor -->
  <rect x="16" y="220" width="848" height="176" rx="12" fill="#FFFBEB" stroke="#F59E0B"/>
  <text x="440" y="252" text-anchor="middle" font-size="15" font-weight="700" fill="#92400E">Anonymous (wired) memory — the floor that does NOT grow with model size</text>
  <g transform="translate(120,300)">
    <rect x="0" y="0" width="180" height="56" rx="8" fill="#FEF3C7" stroke="#D97706"/>
    <text x="90" y="24" text-anchor="middle" font-size="13" font-weight="600" fill="#92400E">0.5B – 1B models</text>
    <text x="90" y="44" text-anchor="middle" font-size="15" font-weight="700" fill="#B45309">≈ 7 MB</text>
  </g>
  <g transform="translate(350,300)">
    <rect x="0" y="0" width="180" height="56" rx="8" fill="#FEF3C7" stroke="#D97706"/>
    <text x="90" y="24" text-anchor="middle" font-size="13" font-weight="600" fill="#92400E">27B dense</text>
    <text x="90" y="44" text-anchor="middle" font-size="15" font-weight="700" fill="#B45309">≈ 77 MB (MemX on)</text>
  </g>
  <g transform="translate(580,300)">
    <rect x="0" y="0" width="200" height="56" rx="8" fill="#FFFFFF" stroke="#D97706"/>
    <text x="100" y="24" text-anchor="middle" font-size="12" font-weight="600" fill="#92400E">what lives there</text>
    <text x="100" y="42" text-anchor="middle" font-size="11" fill="#B45309">KV cache · SSM state · activations</text>
  </g>
</svg>
